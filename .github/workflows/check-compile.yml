name: Check QRCodeGeneratorPro Compile
    
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build Android Debug (compile check)
        run: ./gradlew :composeApp:assembleDebug
      - name: Build iOS Framework (compile check)
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64
